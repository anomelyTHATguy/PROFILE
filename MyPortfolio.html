<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Page setup: character support, responsive sizing, browser tab title, and shared CSS. -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyProfile</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Theme control: CSS uses this checkbox state to display light or dark mode. -->
  <input type="checkbox" id="theme-switch" class="theme-input" aria-label="Toggle light and dark mode" />

  <!-- Site header: profile name and visible light/dark theme toggle. -->
  <header class="navbar" id="home">
    <h1 class="logo"><a href="MyPortfolio.html">MyProfile</a></h1>

    <label for="theme-switch" 
        class="theme-btn" title="Toggle light and dark mode" aria-label="Toggle light and dark mode">
      <span class="icon sun">🌙</span>
      <span class="icon moon">☀️</span>
    </label>
   
  </header>

  <!-- Main navigation: these links open the separate category pages. -->
  <nav class="section-nav" aria-label="Portfolio sections">
    <a href="index.html" aria-current="page">Home</a>
    <a href="about.html">About me</a>
    <a href="education.html">Education</a>
    <a href="skills.html">Skills</a>
    <a href="contact.html">Contact</a>
  </nav>

</body>
</html>
